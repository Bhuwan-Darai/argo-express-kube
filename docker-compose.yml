services: 
  app1:
    image: express-app
    environment:
      - INSTANCE_ID=app1
      - PORT=3000
  app2:
    image: express-app
    environment:
      - INSTANCE_ID=app2
      - PORT=3000
  nginx:
      container_name: nginx-lb
      image: nginx:latest
      ports:
        - "3000:80"
      volumes:
        - ./nginx.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - app1
        - app2