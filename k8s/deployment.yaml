apiVersion: apps/v1
kind: Deployment

metadata:
  name: express-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: express-app

  template:
    metadata:
      labels:
        app: express-app

    spec:
      containers:
        - name: express-app
          image: express-app:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"